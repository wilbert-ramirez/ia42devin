<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/app/"> 
    <title>Dashboard - IA42</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/styles.css" rel="stylesheet">
    <link href="assets/css/dashboard.css" rel="stylesheet">
    
    <link href="assets/css/unified-inline.css" rel="stylesheet" />
</head>
<body>
    <div id="header-placeholder-dashboard"></div>

    <main class="dashboard">
        <div class="dashboard-header">
            <div class="container">
                <div class="dashboard-title">
                    <div class="user-info">
                        <div class="user-avatar" id="userAvatar">
                            <i class="fas fa-user"></i>
                        </div>
                        <div>
                            <h1 id="userName">Cargando...</h1>
                            <div id="userRoles"></div>
                        </div>
                    </div>
                    <div class="quick-actions">
                        <button class="btn btn-primary" id="editProfileBtn">
                            <i class="fas fa-edit"></i> Editar Perfil
                        </button>
                        <button class="btn btn-secondary" id="openAdminPanelBtn" style="display: none;">
                            <i class="fas fa-cogs"></i> Panel Admin
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="dashboard-grid">
                <div class="dashboard-card">
                    <div class="card-header">
                        <div class="card-icon profile">
                            <i class="fas fa-user"></i>
                        </div>
                        <h2 class="card-title">Mi Perfil</h2>
                    </div>
                    <div class="profile-info" id="profileInfo">
                        <div class="loading" id="profileInfoLoading">
                            <i class="fas fa-spinner fa-spin"></i> Cargando perfil...
                        </div>
                    </div>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <div class="card-icon courses">
                            <i class="fas fa-graduation-cap"></i>
                        </div>
                        <h2 class="card-title">Mis Experiencias de Aprendizaje</h2>
                    </div>
                    <div class="text-stat-number ">Activas: <span class="stat-number" id="activeCount"></span></div>
                    <div class="text-stat-number ">Completas: <span class="stat-number" id="completedCount"></span></div>
                    <div class="text-stat-number ">Expiradas: <span class="stat-number" id="expiredCount"></span></div>
                    <div class="stat-label">Experiencias de Aprendizaje disponibles</div>
                    <button class="btn btn-primary courses-link-all" id="exploreCoursesBtn" style="margin-top: 1rem;">
                        <i class="fas fa-plus"></i> Explorar Experiencia de Aprendizaje
                    </button>
                </div>

                <div class="dashboard-card">
                    <div class="card-header">
                        <div class="card-icon activity">
                            <i class="fas fa-history"></i>
                        </div>
                        <h2 class="card-title">Actividad Reciente</h2>
                    </div>
                    <div class="activity-list" id="activityList">
                        <div class="loading" id="activityListLoading">
                            <i class="fas fa-spinner fa-spin"></i> Cargando actividad...
                        </div>
                    </div>
                </div>

                <div class="dashboard-card" id="adminCard" style="display: none;">
                    <div class="card-header">
                        <div class="card-icon admin">
                            <i class="fas fa-shield-alt"></i>
                        </div>
                        <h2 class="card-title">Panel de Administración</h2>
                    </div>
                    <div id="adminStats">
                        <div class="loading" id="adminStatsLoading">
                            <i class="fas fa-spinner fa-spin"></i> Cargando estadísticas...
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal" id="editProfileModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Editar Perfil</h2>
                <span class="close" data-modal-id="editProfileModal">×</span>
            </div>
            <div class="modal-body">
                <form id="editProfileForm" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="editName"><i class="fas fa-user"></i> Nombre Completo</label>
                        <input type="text" id="editName" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="editBirthdate"><i class="fas fa-birthday-cake"></i> Fecha de Nacimiento</label>
                        <input type="date" id="editBirthdate" name="birthdate">
                    </div>
                    <div class="form-group">
                        <label for="editUserAvatar"><i class="fas fa-image"></i> Avatar</label>
                        <input type="file" id="editUserAvatar" name="userAvatar" accept="image/jpeg,image/png">
                        <div class="avatar-preview" id="avatarPreview" style="margin-top: 10px;">
                            <img id="avatarImage" src="" alt="Avatar Preview" style="max-width: 100px; display: none;">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-full">
                        <i class="fas fa-spinner fa-spin" id="editSpinner" style="display: none;"></i>
                        Guardar Cambios
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification">
        <div class="notification-content">
            <i class="fas fa-check-circle"></i>
            <span id="notificationText"></span>
            <span class="notification-close" id="closeDashboardNotificationBtn">×</span>
        </div>
    </div>

    

    <div id="footer-placeholder"></div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script src="assets/js/main.js"></script>
    
</body>
</html>
