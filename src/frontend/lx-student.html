<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cursos - IA42</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/app/" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />

    <style>
      .course-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: var(--background);
        color: var(--foreground);
      }

      .course-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
        background: var(--surface);
        padding: 1rem;
        border-bottom: 1px solid var(--border);
        box-shadow: var(--shadow);
      }

      .course-header h1 {
        font-size: 2rem;
        color: var(--foreground);
      }

      .courses-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .course-card {
        background-color: var(--surface);
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease-in-out;
        border: 1px solid var(--border);
      }

      .course-card:hover {
        transform: translateY(-5px);
        box-shadow: var(--shadow-lg);
      }

      .course-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
      }

      .course-content {
        padding: 1rem;
        flex-grow: 1;
        color: var(--foreground);
      }

      .course-title {
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        color: var(--foreground);
      }

      .course-description {
        font-size: 0.95rem;
        color: var(--muted-foreground);
        margin-bottom: 1rem;
      }

      .course-actions {
        margin-top: auto;
        padding: 0 1rem 1rem;
      }

      .btn-course {
        display: block;
        text-align: center;
        background-color: var(--primary);
        color: var(--primary-foreground);
        padding: 10px;
        border-radius: var(--border-radius);
        text-decoration: none;
        transition: background-color 0.2s ease;
      }

      .btn-course:hover {
        background-color: #0056b3; /* Fallback darker shade */
      }

      /* Header and Footer Styles */
      #header-placeholder {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: var(--surface);
        box-shadow: var(--shadow);
        z-index: 1000;
        padding: 1rem 0;
        border-bottom: 1px solid var(--border);
      }

      #footer-placeholder {
        background: var(--surface);
        padding: 1rem 0;
        border-top: 1px solid var(--border);
        text-align: center;
        color: var(--muted-foreground);
        margin-top: 2rem;
      }

      /* Adjust main content to account for fixed header */
      .course-container {
        padding-top: 80px; /* Adjust based on header height */
        min-height: calc(100vh - 120px); /* Account for header and footer */
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>

    <main class="course-container">
      <div class="course-header">
        <h1>
          <i class="fas fa-graduation-cap"></i> Mis Experiencias de Aprendizaje
        </h1>
        <a href="dashboard.html" class="btn btn-secondary"
          ><i class="fas fa-arrow-left"></i> Volver al Dashboard</a
        >
      </div>

      <div class="courses-grid" id="coursesGrid">
        <!-- Cursos se insertarán aquí dinámicamente -->
      </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="assets/js/theme.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
      document.addEventListener("authReady", async () => {
        try {
          const token = api.getToken();
          console.log(`[lx-student.html] 1. Verificando token. Es ${token ? 'existente' : 'NULO'}.`);

          if (!api.isAuthenticated()) {
            console.error('[lx-student.html] 2. Falla de autenticación: api.isAuthenticated() es falso. Redirigiendo a login.');
            window.location.href = 'login.html';
            return;
          }
          
          console.log('[lx-student.html] 2. Usuario autenticado. Procediendo a llamar la API.');
          const response = await fetch(
            `${API_BASE_URL}/courses/subscriptions`,
            {
              method: "GET",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
            }
          );

          console.log(`[lx-student.html] 3. Respuesta de API recibida con estado: ${response.status}`);
          const data = await response.json();

          if (response.ok) {
            console.log('[lx-student.html] 4. La respuesta es OK. Procesando cursos...', data);
            const courses = data.data.map((course) => ({
              id: course.id,
              title: course.shortname,
              description: course.description,
              image: course.imagepath,
              price: course.price,
              currentprogress: course.currentprogress,
              status: course.status_sub,
              validthru: course.validthru,
            }));

            const grid = document.getElementById("coursesGrid");

            courses.forEach((course) => {
              const card = document.createElement("div");
              card.className = "course-card";

              const fechaExpirada = new Date(course.validthru) < new Date();
              const progressBarContainer = document.createElement("div");
              progressBarContainer.style.width = "100%";
              progressBarContainer.style.marginBottom = "0.5rem";

              const progressText = document.createElement("small");

              if (fechaExpirada) {
                progressText.textContent = `La Fecha está expirada`;
              }else if (course.status === 'completed') {
                progressText.textContent = `LX está Completada`;
              }else {
              progressText.textContent = `Progreso: ${
                course.currentprogress || 0
              }%`;
            }
              progressText.style.display = "flex";
              progressText.style.justifyContent = "space-between";

              const progress = document.createElement("div");
              progress.style.background = "#e0e0e0";
              progress.style.borderRadius = "6px";
              progress.style.overflow = "hidden";
              progress.style.height = "10px";

              const progressInner = document.createElement("div");
              progressInner.style.background = "#ff9800";
              progressInner.style.height = "10px";
              progressInner.style.width = `${course?.currentprogress || 0}%`;

              progress.appendChild(progressInner);
              progressBarContainer.appendChild(progressText);
              progressBarContainer.appendChild(progress);

              // Determinar texto y link según el status

              const actionText =
                course.status === "completed" || fechaExpirada
                  ? "Opinar"
                  : "Continuar";

              const actionHref =
                course.status === "completed" || fechaExpirada
                  ? `lx.html?id=${course.id}&opinar=1`
                  : `lx.html?id=${course.id}`;

              card.innerHTML = `
    <img src="${course.image}" alt="${course.title}" class="course-image">
    <div class="course-content">
      <h3 class="course-title">${course.title}</h3>
      <p class="course-description">${course.description}</p>
    </div>
    <div class="course-actions">
      <a href="${actionHref}" class="btn-course"><i class="fas fa-play"></i> ${actionText}</a>
    </div>
  `;

              const courseContent = card.querySelector(".course-content");
              const coursePrice = card.querySelector(".course-price");
              courseContent.appendChild(progressBarContainer);

              grid.appendChild(card);
            });
          } else {
            console.error("[lx-student.html] 4. La respuesta de API no fue OK.", data);
          }
        } catch (error) {
          console.error("[lx-student.html] 5. Ocurrió un error CRÍTICO en el bloque try-catch:", error);
        }
      });
    </script>
  </body>
</html>
