<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interacción IA - IA42</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
    <link href="assets/css/index.css" rel="stylesheet" />
    <base href="/app/" />
    
      <link href="assets/css/unified-inline.css" rel="stylesheet" />
</head>
  <body>
    <div id="header-placeholder"></div>
    <main id="chat-container" class="chat-container" style="display: none">
      <div class="chat-header">
        <a href="/experience/" class="btn-icon" id="back-button">
          <i class="fas fa-arrow-left"></i>
        </a>
        <h1 id="experience-title">Interacción IA</h1>
        <div>
          <button class="btn-icon" id="feedback-button" title="Opinar la Interacción">
            <i class="fas fa-comments"></i> Opinar
          </button>
          <button class="btn-icon" id="restart-button" title="Reiniciar Interacción">
            <i class="fas fa-sync-alt"></i>
          </button>
          <button class="btn-icon" id="settings-button" title="Ajustes">
            <i class="fas fa-cog"></i>
          </button>
        </div>
      </div>
      <div id="chat-messages" class="chat-messages custom-scrollbar"></div>
      <div class="chat-input">
        <textarea
          id="message-input"
          placeholder="Escribe tu mensaje aquí..."
          rows="1"
          disabled
        ></textarea>
        <button id="send-button" class="btn-primary" disabled>
          <i class="fas fa-paper-plane"></i>
        </button>
        <button id="start-button" class="btn-primary" action="start">
          <i class="fas fa-play"></i> Iniciar
        </button>
        <button id="clarify-button" class="btn-primary" action="clarify" style="display: block">
          <i class="fas fa-question-circle"></i> Sácame de una duda!
        </button>
        <button id="done-button" class="btn-primary-todo" action="done" style="display: none">
          <i class="fas fa-stop"></i> Todo por Ahora!
        </button>
        <button id="evaluate-button" class="btn-primary" action="evaluate" style="display: none">
          <i class="fas fa-chart-bar"></i> Evaluemos mi Progreso
        </button>
      </div>
      <div id="feedback-modal" class="modal" style="display: none">
        <div class="modal-content">
          <h2>Enviar Opinión</h2>
          <form id="feedback-form">
            <label for="stars">Calificación:</label>
            <div class="star-rating">
              <input type="radio" name="stars" id="star5" value="5" required />
              <label for="star5">★</label>
              <input type="radio" name="stars" id="star4" value="4" />
              <label for="star4">★</label>
              <input type="radio" name="stars" id="star3" value="3" />
              <label for="star3">★</label>
              <input type="radio" name="stars" id="star2" value="2" />
              <label for="star2">★</label>
              <input type="radio" name="stars" id="star1" value="1" />
              <label for="star1">★</label>
            </div>
            <label for="feedback-text">Comentarios:</label>
            <textarea
              id="feedback-text"
              name="text"
              rows="4"
              placeholder="Escribe tu opinión aquí (mínimo 10 caracteres)..."
              required
            ></textarea>
            <p style="font-size: 0.8rem; color: #666">
              El comentario debe tener al menos 10 caracteres.
            </p>
            <div class="modal-actions">
              <button type="button" id="cancel-feedback" class="btn-primary">
                Cancelar
              </button>
              <button type="submit" id="submit-feedback" class="btn-primary">
                Enviar
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
    <div id="error-message" class="error-message" style="display: none"></div>
    <div id="loading-container" class="loading-container">
      <i class="fas fa-spinner fa-spin fa-2x"></i>
    </div>
    <div id="notificationContainer"></div>
    <div id="footer-placeholder"></div>
    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/index.js" defer></script>
    <script src="assets/js/lx.js"></script>
  </body>
</html>
