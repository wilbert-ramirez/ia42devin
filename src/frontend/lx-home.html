<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursos - IA42</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="assets/css/styles.css" rel="stylesheet" />
    <link href="assets/css/index.css" rel="stylesheet" />
    <base href="/app/" />
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f4f4f4;
        transition: background-color 0.3s, color 0.3s;
      }

      body.dark-theme {
        background-color: #333;
        color: #ddd;
      }

      .course-container {
        margin: 5%;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 1rem;
      }

      .courses-section {
        padding: 3rem 1rem;
      }

      .courses-section h1 {
        text-align: center;
        font-size: 2rem;
        margin-bottom: 2rem;
        color: #333;
      }

      body.dark-theme .courses-section h1 {
        color: #ddd;
      }

      .courses-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
      }

      .course-card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        transition: transform 0.2s, background-color 0.3s, box-shadow 0.3s;
        display: flex;
        flex-direction: column;
      }

      body.dark-theme .course-card {
        background: #444;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }

      .course-card:hover {
        transform: translateY(-5px);
      }

      .course-image {
        width: 100%;
        height: 280px;
        object-fit: cover;
      }

      .course-content {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 1rem;
        height: 100%;
      }

      .course-title {
        font-size: 1.1em;
        margin-bottom: 0.5rem;
        color: #333;
      }

      body.dark-theme .course-title {
        color: #fff;
      }

      .course-desc {
        font-size: 0.9em;
        color: #666;
        margin-bottom: 0.5rem;
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }

      body.dark-theme .course-desc {
        color: #bbb;
      }

      .course-price {
        font-size: 1.1em;
        color: #ffc107;
        font-weight: bold;
        margin-bottom: 0.5rem;
      }

      body.dark-theme .course-price {
        color: #ffd700;
      }

      .btn-primary {
        background-color: #ffc107;
        color: black;
        font-weight: bold;
        border: none;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      body.dark-theme .btn-primary {
        background-color: #e0a800;
        color: #fff;
      }

      .btn-primary:hover {
        background-color: #e0a800;
      }

      body.dark-theme .btn-primary:hover {
        background-color: #cc9600;
      }

      .btn-outline-dark {
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        border: 1px solid #333;
        color: #333;
        background: transparent;
        border-radius: 0.5rem;
        padding: 0.75rem 1.5rem;
        cursor: pointer;
      }

      body.dark-theme .btn-outline-dark {
        border-color: #ddd;
        color: #ddd;
      }

      body.dark-theme .btn-outline-dark:hover {
        background-color: #555;
        border-color: #fff;
        color: #fff;
      }

      .actionsContainer {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
      }

      .actionsContainer .btn {
        flex: 1 1 calc(50% - 0.25rem);
        text-align: center;
        padding: 0.75rem 1rem;
        box-sizing: border-box;
      }

      .loading,
      .error {
        text-align: center;
        font-size: 1.2em;
        margin: 20px;
        color: #333;
      }

      body.dark-theme .loading,
      body.dark-theme .error {
        color: #ddd;
      }
    </style>
  </head>
  <body>
    <div id="header-placeholder"></div>
    <main class="course-container">
      <h1>
        <i class="fas fa-graduation-cap"></i> Las Experiencias de Aprendizaje
      </h1>
      <div id="courses-container" class="courses-container"></div>
      <div id="loading" class="loading">Cargando cursos...</div>
      <div id="error" class="error" style="display: none"></div>
    </main>
    <div id="footer-placeholder"></div>
    <div id="notificationContainer"></div>

    <script src="assets/js/theme.js" defer></script>
    <script src="assets/js/api.js" defer></script>
    <script src="assets/js/auth.js" defer></script>
    <script src="assets/js/main.js" defer></script>
    <script src="assets/js/index.js" defer></script>
    <script src="assets/js/lxs.js" defer></script>
  </body>
</html>
